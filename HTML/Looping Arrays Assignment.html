<!DOCTYPE html>
<html> 
    <head>
        <title>The Array Makes Me Loopy</title> 

    </head>
    <body>

        <p id="p1"> Name </p>
        <p id="p2"> Grades </p>
        <p id="p3"> Average </p>
        
        <script>

            let i = 0
            let name = window.prompt("H U M A N... E N T E R  Y O U R  N A M E")
            let grade = []
            for (i = 0; i < 4; i++)

            {
                grade[i] = parseFloat(window.prompt("Please imput a number"))
            }

            let gradeAverage = (grade[0] + grade[1] + grade[2] + grade[3]) /4

            document.getElementById("p1").innerHTML = name 
            document.getElementById("p2").innerHTML = "Your grades are: " + grade
            document.getElementById("p3").innerHTML = "You average is: " + gradeAverage + "%"

        </script>
    </body> 
</html>
