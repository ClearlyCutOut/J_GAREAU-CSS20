<!DOCTYPE html>
<html>
<head>
    <title>Lay Order Forme</title>

    <script>
        // Prices
        let pencils = 0.30;
        let pens = 0.50;
        let erasers = 1.00;

        // Tax rates
        let alberTax = 1.05;
        let saskTax = 1.11;
        let maniTax = 1.13;

        function message() {

            let place = document.getElementById("provinces").value;

            if (place == "NaP") {
                window.alert("Select a Place");
                return;
            }

            // Gets number of items from user
            let numOfPencils = Number(document.getElementById("numOfPencils").value) || 0;
            let numOfPens = Number(document.getElementById("numOfPens").value) || 0;
            let numOfErasers = Number(document.getElementById("numOfErasers").value) || 0;

            // Calculates subtotal
            let subtotal =
                (numOfPencils * pencils) +
                (numOfPens * pens) +
                (numOfErasers * erasers);

            let total;

            // Applies the tax
            if (place == "sask") {
                total = subtotal * saskTax;

                // Saskatchewan-ian discount
                if (total >= 30) {
                    total = total - 5;
                }
            }
            else if (place == "alb") {
                total = subtotal * alberTax;
            }
            else if (place == "man") {
                total = subtotal * maniTax;
            }
            if (place == "sask" && (subtotal * saskTax) >= 30) {
            window.alert(
                "Subtotal: $" + subtotal.toFixed(2) +
                "\nAmount met for Saskatchewan-ian Discount: -$5.00" +
                "\nTotal: $" + total.toFixed(2)
            );
        }
        else {
            window.alert(
                "Subtotal: $" + subtotal.toFixed(2) +
                "\nTotal: $" + total.toFixed(2)
            );
        }
    }
        
    </script>
</head>

<body>

    <h2>Jordan's very cool and very boring order form "JVCAVBOF"</h2>

    Pencils = $0.30 each<br>
    <input type="number" id="numOfPencils" placeholder="Pencils" min="0">
    <br><br>

    Pens = $0.50 each<br>
    <input type="number" id="numOfPens" placeholder="Pens" min="0">
    <br><br>

    Erasers = $1.00 each<br>
    <input type="number" id="numOfErasers" placeholder="Erasers" min="0">
    <br><br>

    <label for="provinces">Where are you from?</label><br>

    <select id="provinces">
        <option value="NaP">Select</option>
        <option value="sask">Saskatchewan</option>
        <option value="alb">Alberta</option>
        <option value="man">Manitoba</option>
    </select>

    <br><br>

    <input type="button" value="Confirm Order" onclick="message()">

</body>
</html>
